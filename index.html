<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>피라미드 키우기 - Pyramid Tycoon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1206; }
    #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      font-family: 'Segoe UI', sans-serif; color: #f4e4c1;
    }
    #ui-overlay > * { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="game-canvas"></div>
  <div id="ui-overlay"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
